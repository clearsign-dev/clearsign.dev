# Publish the site to GitHub Pages.
#
# The build is a static export — plain files, no server, nothing running at
# request time — so Pages is enough and there is nothing to keep alive.
#
# Two things to know before this works:
#   - Pages on a Free plan needs the repository to be public.
#   - Settings -> Pages -> Source must be set to "GitHub Actions" once, by hand.
#     Nothing here can set it for you.
#
# The base path is taken from what Pages reports, so the same workflow serves
# the site correctly at <org>.github.io/clearsign.dev/ and at a custom domain
# later, with nothing to edit in between.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is allowed to finish rather than be
# cancelled, so a half-uploaded site is never what is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install exactly what the lockfile names
        run: npm ci
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Build
        # Pages reports where the site will live. At <org>.github.io/<repo>/ that
        # is a subpath, and without it every asset on the page 404s. On a custom
        # domain it comes back empty and nothing changes.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "building for base path: '${BASE_PATH:-/}'"
          npm run build
      - name: Check the export is really static
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/privacy/index.html
          test -f out/404.html
          # Pages would otherwise treat _next/ as Jekyll source and drop it.
          touch out/.nojekyll
          echo "publishing $(find out -type f | wc -l | tr -d ' ') files"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
