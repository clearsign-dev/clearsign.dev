# The site has no server and nothing runs at request time, so there is one
# question worth asking on every change: does it still build?
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: the site still builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exactly what the lockfile names
        run: npm ci
      - name: Lints
        run: npm run lint
      - name: Build
        # `next build` type-checks as it goes, so this covers TypeScript too.
        run: npm run build
      - name: Check the export is really static
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/privacy/index.html
          test -f out/404.html
          echo "static export: $(find out -type f | wc -l | tr -d ' ') files"
