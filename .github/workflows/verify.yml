# The site has no server and nothing runs at request time, so there is one
# question worth asking on every change: does it still build?
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: the site still builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exactly what the lockfile names
        run: npm ci
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Lints
        run: npm run lint
      - name: Build
        # `next build` type-checks as it goes, so this covers TypeScript too.
        run: npm run build
      - name: Check the export is really static
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/privacy/index.html
          test -f out/404.html
          echo "static export: $(find out -type f | wc -l | tr -d ' ') files"
